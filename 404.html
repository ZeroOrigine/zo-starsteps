<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Star Steps</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#6D3BE8">
<style>
:root{--paper:#EEF0FE;--card:#FFFFFF;--ink:#221A3D;--edge:#221A3D;--muted:#5A5280;--grape:#6D3BE8}
@media (prefers-color-scheme:dark){:root{--paper:#171233;--card:#251E52;--ink:#F4F1FF;--edge:#0A0718;--muted:#B4A9E2;--grape:#8C63FF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700;text-align:center}
.card{max-width:440px;width:100%;padding:28px 22px;background:var(--card);border:3px solid var(--edge);border-radius:26px;box-shadow:6px 6px 0 var(--edge)}
img{width:120px;height:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
h1{font-size:30px;margin:10px 0 6px}
p{color:var(--muted);margin:0 0 20px}
a{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:10px;border:3px solid var(--edge);border-radius:16px;
  text-decoration:none;font-weight:800;font-size:17px;color:var(--ink);background:var(--card);box-shadow:0 4px 0 var(--edge)}
a.go{background:var(--grape);color:#fff}
@media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main class="card">
  <img src="/img/pip.webp" alt="Pip, the Star Steps guide" width="482" height="497">
  <h1>This step is missing</h1>
  <p>Pip looked everywhere, but this page is not here.</p>
  <a class="go" href="/play/">Play Star Steps</a>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
